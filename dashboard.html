<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>TimeTrack Dashboard</title>
  <link rel="stylesheet" href="dashboard.css">
</head>
<body>
  <div class="sidebar">
    <div class="brand">
      <img src="icons/icon48.png" id="logo-icon" onerror="this.src='icons/icon16.png'" alt="logo">
      <h1>TimeTrack</h1>
    </div>
    <nav class="nav-menu">
      <a href="#" class="nav-item active" id="nav-dashboard">Dashboard</a>
      <a href="options.html" class="nav-item">Settings</a>
    </nav>
    <div class="sidebar-footer">
      Your data stays local.
    </div>
  </div>

  <div class="main-content">
    <header class="header">
      <h2>Dashboard overview</h2>
      <div class="date-display" id="date-display">Today</div>
    </header>

    <div class="summary-cards">
      <div class="card">
        <div class="card-title">Today's Time</div>
        <div class="card-value" id="stat-total-time">0h 0m</div>
      </div>
      <div class="card">
        <div class="card-title">Websites Visited</div>
        <div class="card-value" id="stat-websites-count">0</div>
      </div>
      <div class="card">
        <div class="card-title">Most Used</div>
        <div class="card-value" id="stat-most-used">-</div>
      </div>
      <div class="card">
        <div class="card-title">Average Time</div>
        <div class="card-value" id="stat-average-time">0m</div>
      </div>
    </div>

    <div class="charts-container">
      <div class="chart-box main-chart">
        <h3>Today's Top 5 Websites</h3>
        <div class="bar-chart" id="today-chart">
          <!-- Bars via JS -->
        </div>
      </div>
      <div class="chart-box side-chart">
        <h3>Last 7 Days</h3>
        <div class="bar-chart vertical" id="history-chart">
          <!-- Bars via JS -->
        </div>
      </div>
    </div>

    <div class="table-container">
      <h3>Today's Website Usage</h3>
      <table class="usage-table">
        <thead>
          <tr>
            <th>Website</th>
            <th>Time Spent</th>
            <th>% of Total</th>
          </tr>
        </thead>
        <tbody id="usage-table-body">
          <!-- Rows via JS -->
        </tbody>
      </table>
    </div>
  </div>

  <script type="module" src="dashboard.js"></script>
</body>
</html>
